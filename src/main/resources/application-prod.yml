# in minutes
cache:
  ttl:
    latestStatCountry: 35
    oneDayPrevious: 1440
    twoDayPrevious: 2880
    vaccineCoverageTrends: 7200
    alertMessage: 35

  host: ${REDIS_HOST}
  port: 6379

api:
  key: ${API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: circuitbreakers

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans